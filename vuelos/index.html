<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vuelos - VolAR</title>
<style>body{margin:0;font:14px Inter,system-ui;background:#f7f8fb}.nav{padding:12px 16px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px;margin-bottom:10px}.btn{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:7px 12px}</style>
</head><body>
<div class="nav"><a href="/">← Home</a><b>Vuelos</b><input id="qNum" placeholder="Nº vuelo AR1300" class="btn"><input id="qOrig" placeholder="Origen AEP" class="btn" style="width:110px"><input id="qDest" placeholder="Destino COR" class="btn" style="width:110px"><button class="btn" style="background:#0f62fe;color:#fff" onclick="buscar()">Buscar</button></div>
<div style="max-width:800px;margin:auto;padding:16px"><div id="res"></div><div style="margin-top:20px;padding:12px;background:#fff;border-radius:12px;border:1px dashed #e4e7ec;font-size:12px;color:#667085">Arquitectura lista para API real. Hoy lee <code>/data/flights.json</code>. Mañana reemplazás el fetch por API sin cambiar UI.</div></div>
<script>
let FLIGHTS=[], AIRCRAFT=[];
Promise.all([fetch('/data/flights.json').then(r=>r.json()).catch(()=>[]), fetch('/data/aircraft.json').then(r=>r.json()).catch(()=>[])]).then(([f,a])=>{FLIGHTS=f;AIRCRAFT=a;const q=new URLSearchParams(location.search).get('q');if(q) document.getElementById('qNum').value=q;buscar()});
function buscar(){let list=[...FLIGHTS];const num=document.getElementById('qNum').value.toUpperCase().trim();const o=document.getElementById('qOrig').value.toUpperCase().trim();const d=document.getElementById('qDest').value.toUpperCase().trim();if(num) list=list.filter(x=>x.numero.includes(num)||x.id.includes(num.toLowerCase()));if(o) list=list.filter(x=>x.origen===o);if(d) list=list.filter(x=>x.destino===d);render(list)}
function render(list){const c=document.getElementById('res');if(!list.length){c.innerHTML='<div class="card">No tenemos información suficiente para identificar vuelos con esos datos. Probá AR1300, AR1736.</div>';return}c.innerHTML=list.map(f=>{const acIds=f.aircraftIds||[];const acs=acIds.map(id=>AIRCRAFT.find(a=>a.id===id)).filter(Boolean);return `<div class="card"><div style="font-weight:800">${f.numero} — ${f.origen} → ${f.destino}</div><div style="font-size:12px;color:#667085">Aerolínea: ${f.aerolineaId} • Duración: ${f.duracion||'Info no disponible'}</div><div style="margin-top:10px"><b>¿Qué avión voy a tomar?</b><br>${acs.length? acs.map(a=>`Este vuelo está asociado al <a href="/aviones/#${a.id}">${a.nombre_completo}</a> — <img src="${a.image}" style="width:80px;height:50px;object-fit:cover;border-radius:8px;vertical-align:middle">`).join('<br>') : 'No tenemos información suficiente para identificar el avión de este vuelo.'}</div></div>`}).join('')}
</script></body></html>
