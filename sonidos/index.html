<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonidos - VolAR</title>
<style>body{margin:0;font:14px Inter,system-ui;background:#f7f8fb}.nav{padding:12px 16px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px}.btn{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px}</style>
</head><body>
<div class="nav"><a href="/">← Home</a><b>Sonidos</b><select id="fAvion" class="btn" onchange="filtrar()"><option value="">Todos aviones</option><option value="airbus">Airbus</option><option value="boeing">Boeing</option><option value="embraer">Embraer</option></select><select id="fEtapa" class="btn" onchange="filtrar()"><option value="">Todas etapas</option><option>antes de salir</option><option>pushback</option><option>puesta en marcha</option><option>rodaje</option><option>despegue</option><option>ascenso</option><option>crucero</option><option>descenso</option><option>aproximacion</option><option>aterrizaje</option><option>despues del aterrizaje</option></select><select id="fOrigen" class="btn" onchange="filtrar()"><option value="">Cabina / Sistema</option><option value="cabina">Cabina</option><option value="sistema">Sistema del avión</option></select><select id="fExp" class="btn" onchange="filtrar()"><option value="">Tipo experiencia</option><option value="sonido">Sonido</option><option value="vibracion">Vibración</option><option value="movimiento">Movimiento</option><option value="presion">Presión</option></select><select id="fNorm" class="btn" onchange="filtrar()"><option value="">Normal / Consultar</option><option value="normal">NORMAL</option><option value="consultar">CONSULTAR CON TRIPULACIÓN</option></select></div>
<div id="grid" class="grid">Cargando sounds.json...</div>
<div id="detail" style="max-width:800px;margin:0 auto;padding:16px"></div>
<script>
let DATA=[];
fetch('/data/sounds.json').then(r=>r.json()).then(j=>{DATA=j;filtrar()}).catch(()=>{document.getElementById('grid').innerHTML='Falta /data/sounds.json. Usá el ejemplo que te pasé.'});
function filtrar(){let list=[...DATA];const av=document.getElementById('fAvion').value;const et=document.getElementById('fEtapa').value;const org=document.getElementById('fOrigen').value;const exp=document.getElementById('fExp').value;const norm=document.getElementById('fNorm').value;if(av) list=list.filter(s=> (s.avion||[]).join(' ').toLowerCase().includes(av));if(et) list=list.filter(s=>s.etapa===et);if(org) list=list.filter(s=>s.categoria===org);if(exp) list=list.filter(s=>(s.experiencia||[]).includes(exp));if(norm){list=list.filter(s=> norm==='normal'? s.es_normal :!s.es_normal)}render(list)}
function render(list){document.getElementById('grid').innerHTML=list.map(s=>`<div class="card" onclick="show('${s.id}')" style="cursor:pointer"><div style="display:flex;justify-content:space-between"><b>${s.nombre}</b><span style="font-size:10px;padding:3px 8px;border-radius:999px;background:${s.es_normal?'#e6f4ea':'#fef3c7'}">${s.es_normal?'NORMAL':'CONSULTAR'}</span></div><div style="font-size:12px;color:#667085;margin-top:4px">${s.etapa} • ${s.categoria} • ${(s.avion||[]).join(', ')}</div><div style="font-size:12px;margin-top:6px">${s.descripcion}</div></div>`).join('')||'<div style="padding:20px">Sin resultados con esos filtros</div>'}
function show(id){const s=DATA.find(x=>x.id===id);if(!s) return;document.getElementById('detail').innerHTML=`<div class="card"><h2>${s.nombre}</h2><audio controls src="${s.audio}" style="width:100%"></audio><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div><b>Etapa:</b> ${s.etapa}</div><div><b>Origen:</b> ${s.origen}</div><div><b>Categoría:</b> ${s.categoria}</div><div><b>¿Es normal?:</b> ${s.es_normal?'Sí, comportamiento habitual':'Consultar con tripulación si tenés duda'}</div></div><p><b>Qué está ocurriendo:</b> ${s.que_ocurre}</p><p><b>Por qué se escucha:</b> ${s.por_que}</p><p><b>Cuándo:</b> ${s.cuando}</p><p><b>Qué podés sentir:</b> ${s.sensacion}</p><p style="font-size:11px;color:#667085">Fuente: ${s.fuente} • Licencia: ${s.licencia}</p></div>`;window.scrollTo({top:document.getElementById('detail').offsetTop-80,behavior:'smooth'})}
</script></body></html>
