<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VolAR — Conocé lo que vuela sobre Argentina</title>
<style>
:root{--bg:#fbfdff;--card:#fff;--text:#0e1a2a;--muted:#5d718d;--blue:#0f62fe;--blueD:#0b3d91;--b:#e6eefb}
[data-theme=dark]{--bg:#050a14;--card:#0d1424;--text:#eef3ff;--muted:#8aa0c2;--b:#1a2a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui}
.nav{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--b);display:flex;gap:12px;padding:10px 16px;align-items:center}
.logo{font-weight:900;display:flex;gap:8px;align-items:center}.badge{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blueD),var(--blue));display:grid;place-items:center;color:white}
.search{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--b);border-radius:999px;padding:8px 14px}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}
.hero{padding:40px 20px 20px;text-align:center;max-width:900px;margin:auto}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:.9;margin:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--b);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer}
.grid{max-width:1220px;margin:auto;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:12px}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 16px;max-width:1220px;margin:auto}
.btn{border:1px solid var(--b);background:var(--card);padding:7px 12px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.section{max-width:1220px;margin:16px auto;padding:0 16px}
.timeline{display:flex;gap:8px;overflow:auto;padding:8px 0}
.phase{min-width:120px;padding:10px;border-radius:12px;border:1px solid var(--b);background:var(--card);cursor:pointer}
.phase.active{background:var(--blue);color:white}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="nav">
  <div class="logo"><div class="badge">✈</div> VolAR</div>
  <div class="search">🔍<input id="globalSearch" placeholder="Buscá un avión, aerolínea, vuelo o aeropuerto…" oninput="doSearch(this.value)"></div>
  <div style="display:flex;gap:6px"><a href="#aviones" class="chip">Aviones</a><a href="#sonidos" class="chip">Sonidos</a><a href="#vuelo" class="chip">Mi vuelo</a><button class="btn" onclick="toggleTheme()">🌙</button></div>
</div>
<div class="hero">
  <h1>VolAR<br>Conocé lo que vuela sobre Argentina.</h1>
  <div class="quick">
    <button class="chip" onclick="scrollToId('aviones')">✈️ Aviones</button>
    <button class="chip" onclick="scrollToId('rutas')">🗺️ Explorar rutas</button>
  </div>
</div>
<div class="tabs" id="filters"></div>
<div class="section"><div id="aircraftGrid" class="grid"></div></div>
<div class="section" id="sonidos"><h2>¿Qué es ese sonido?</h2><div id="soundList" class="grid"></div></div>
<div class="section" id="sintiendo"><h2>¿Qué estoy sintiendo?</h2><div id="phaseLine" class="timeline"></div><div id="phaseDetail" class="card"></div></div>
<div class="section" id="vuelo"><h2>🛫 Mi vuelo</h2><div class="search" style="max-width:380px"><input id="flightNum" placeholder="Ej: AR1300"><button class="btn primary" onclick="findFlight()" style="margin-left:6px">Buscar</button></div><div id="flightRes" style="margin-top:10px"></div></div>

<div class="section" id="rutas"><h2>🗺️ Explorar rutas — Argentina</h2>
<div class="card"><div id="routeMap" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="airportDetail" style="margin-top:14px"></div></div></div>

<script>
let DATA={
 aircraft:[
  {id:"a320", manufacturer:"Airbus", model:"A320", variant:"A320-200", length:37.57, wingspan:35.8, pax:186, range:6100, engines:"CFM56-5B", facts:"El más usado en Argentina."},
  {id:"a320n", manufacturer:"Airbus", model:"A320neo", variant:"A320-271N", length:37.57, wingspan:35.8, pax:186, range:6400, engines:"LEAP-1A", facts:"15% menos consumo."},
  {id:"b738", manufacturer:"Boeing", model:"737-800", variant:"737-8AS", length:39.5, wingspan:35.8, pax:189, range:5400, engines:"CFM56-7B", facts:"Sky Interior."},
  {id:"b38m", manufacturer:"Boeing", model:"737 MAX 8", variant:"MAX 8", length:39.47, wingspan:35.9, pax:200, range:6500, engines:"LEAP-1B", facts:"Más eficiente."},
  {id:"e190", manufacturer:"Embraer", model:"E190", variant:"E190AR", length:36.24, wingspan:28.72, pax:114, range:4500, engines:"CF34-10E", facts:"Regional."}
 ],
 airports:[],
 routes:[
  {id:"AR1300", origin:"AEP", dest:"COR", aircraft:"a320", duration:"1h20"},
  {id:"AR1736", origin:"AEP", dest:"IGR", aircraft:"a320", duration:"1h55"}
 ],
 sounds:[
  {id:"apu", name:"APU", phase:"Antes del despegue", when:"Antes de embarcar", what:"Turbina auxiliar"},
  {id:"flaps", name:"FLAPS", phase:"Despegue", when:"En pista", what:"Configuración alar"},
  {id:"gear", name:"TREN", phase:"Aterrizaje", when:"En aproximación", what:"Extensión"}
 ],
 phases:[
  {id:"puerta", label:"PUERTA", feel:"Vibración suave", doing:"Chequeos"},
  {id:"rodaje", label:"RODAJE", feel:"Movimiento lento", doing:"Va a pista"},
  {id:"despegue", label:"DESPEGUE", feel:"Aceleración", doing:"Potencia máxima"},
  {id:"crucero", label:"CRUCERO", feel:"Estable", doing:"Autopiloto"},
  {id:"aterrizaje", label:"ATERRIZAJE", feel:"Descenso", doing:"Aterriza"}
 ]
};
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark')}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}
let activeMan='Todos';
function renderFilters(){const m=['Todos',...new Set(DATA.aircraft.map(a=>a.manufacturer))];document.getElementById('filters').innerHTML=m.map(x=>`<button class="btn ${activeMan===x?'primary':''}" onclick="setMan('${x}')">${x}</button>`).join('')}
function setMan(m){activeMan=m;renderFilters();renderAircraft()}
function renderAircraft(list=DATA.aircraft){const g=document.getElementById('aircraftGrid');const f=list.filter(a=>activeMan==='Todos'||a.manufacturer===activeMan);g.innerHTML=f.map(a=>`<div class="card"><b>${a.manufacturer} ${a.model}</b><div style="margin-top:6px;font-size:13px">${a.pax} pax • ${a.range}km • ${a.engines}</div><div style="font-size:12px;color:#5d718d;margin-top:4px">${a.facts}</div></div>`).join('')}
function renderSounds(list=DATA.sounds){document.getElementById('soundList').innerHTML=list.map(s=>`<div class="card"><b>${s.name}</b> — ${s.phase}<br><span style="font-size:12px">${s.when}: ${s.what}</span></div>`).join('')}
function renderPhases(){document.getElementById('phaseLine').innerHTML=DATA.phases.map(p=>`<div class="phase" id="ph-${p.id}" onclick="showPhase('${p.id}')">${p.label}</div>`).join('');showPhase('puerta')}
function showPhase(id){document.querySelectorAll('.phase').forEach(e=>e.classList.remove('active'));document.getElementById('ph-'+id)?.classList.add('active');const p=DATA.phases.find(x=>x.id===id);document.getElementById('phaseDetail').innerHTML=`<b>Qué hace el avión:</b> ${p.doing}<br><div style="margin-top:6px"><b>Sensación:</b> ${p.feel}</div>`}
function findFlight(){const n=document.getElementById('flightNum').value.toUpperCase().trim();const r=DATA.routes.find(x=>x.id===n);const b=document.getElementById('flightRes');if(!r){b.innerHTML=`<div class="card">Vuelo no encontrado</div>`;return}b.innerHTML=`<div class="card"><b>${r.id}</b> ${r.origin} → ${r.dest} • ${r.duration}</div>`}
function renderRoutes(){
 document.getElementById('routeMap').innerHTML=DATA.airports.map(ap=>`<button class="btn" onclick="showAirport('${ap.id}')">${ap.iata} — ${ap.ciudad}</button>`).join('');
 if(DATA.airports.length) showAirport(DATA.airports[0].id);
}
function showAirport(id){
 const ap=DATA.airports.find(a=>a.id===id); if(!ap) return;
 const img=ap.images?.principal?.url||ap.image;
 const wiki=ap.images?.principal?.wiki_url||'';
 document.getElementById('airportDetail').innerHTML=`
 <div class="card" style="max-width:600px">
   <img src="${img}" alt="${ap.nombre_completo||ap.city}" style="width:100%;height:200px;object-fit:cover;border-radius:12px;margin-bottom:10px" onerror="this.src='${wiki}';this.onerror=null">
   <div style="font-size:18px;font-weight:800">${ap.nombre_completo||ap.city} (${ap.iata}/${ap.icao})</div>
   <div style="margin-top:6px;line-height:1.6;color:#5d718d">
     ${ap.ciudad} - ${ap.provincia||ap.prov}<br>
     Pasajeros 2025: ${ap.pasajeros_2025?.toLocaleString('es-AR')||ap.pax?.toLocaleString('es-AR')||'—'}<br>
     Promedio diario: ${ap.promedio_diario_2025?.toLocaleString('es-AR')||'—'}
   </div>
 </div>`;
}
function doSearch(q){q=q.toLowerCase();if(!q){renderAircraft(DATA.aircraft);renderRoutes();renderSounds();return}renderAircraft(DATA.aircraft.filter(a=>(a.model+a.manufacturer).toLowerCase().includes(q)));const f=DATA.airports.filter(a=>(a.ciudad+a.nombre_completo+a.iata).toLowerCase().includes(q));if(f.length){document.getElementById('routeMap').innerHTML=f.map(ap=>`<button class="btn" onclick="showAirport('${ap.id}')">${ap.iata} — ${ap.ciudad}</button>`).join('');scrollToId('rutas');}}

fetch('/data/airports.json').then(r=>r.json()).then(j=>{DATA.airports=j;renderRoutes()}).catch(()=>{
 DATA.airports=[
  {id:"EZE",iata:"EZE",icao:"SAEZ",ciudad:"Ezeiza",provincia:"Buenos Aires",nombre_completo:"Ministro Pistarini",pasajeros_2025:11911000,promedio_diario_2025:32633,images:{principal:{url:"/images/airports/eze.jpg",wiki_url:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Aeropuerto_Internacional_de_Ezeiza.jpg/800px-Aeropuerto_Internacional_de_Ezeiza.jpg"}}},
  {id:"AEP",iata:"AEP",icao:"SABE",ciudad:"Buenos Aires",provincia:"CABA",nombre_completo:"Aeroparque Jorge Newbery",pasajeros_2025:17738000,promedio_diario_2025:48597,images:{principal:{url:"/images/airports/aep.jpg",wiki_url:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Aeroparque_Jorge_Newbery.jpg/800px-Aeroparque_Jorge_Newbery.jpg"}}},
  {id:"COR",iata:"COR",icao:"SACO",ciudad:"Córdoba",provincia:"Córdoba",nombre_completo:"Ambrosio Taravella",pasajeros_2025:3265000,promedio_diario_2025:8945,images:{principal:{url:"/images/airports/cor.jpg",wiki_url:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Aeropuerto_Cordoba_Taravella.jpg/800px-Aeropuerto_Cordoba_Taravella.jpg"}}}
 ];renderRoutes();
});
renderFilters();renderAircraft();renderSounds();renderPhases();
</script>
</body>
</html>
