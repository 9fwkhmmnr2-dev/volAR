<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VolAR — Conocé lo que vuela sobre Argentina</title>
<style>
:root{--bg:#fbfdff;--card:#fff;--text:#0e1a2a;--muted:#5d718d;--blue:#0f62fe;--blueD:#0b3d91;--b:#e6eefb}
[data-theme=dark]{--bg:#050a14;--card:#0d1424;--text:#eef3ff;--muted:#8aa0c2;--b:#1a2a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui}
.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 85%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--b);display:flex;gap:18px;padding:12px 20px;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900}.badge{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blueD),var(--blue));display:grid;place-items:center;color:white}
.search{flex:1;min-width:220px;max-width:520px;display:flex;align-items:center;background:var(--card);border:1px solid var(--b);border-radius:999px;padding:8px 14px}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}
.hero{padding:56px 20px 28px;text-align:center;max-width:980px;margin:auto}
.hero h1{font-size: clamp(38px,6vw,68px);line-height:.9;margin:0;font-weight:900}
.hero p{color:var(--muted);font-size:18px}
.quick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.chip{border:1px solid var(--b);background:var(--card);padding:10px 14px;border-radius:999px;cursor:pointer}
.grid{max-width:1220px;margin:auto;padding:18px 16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:var(--blue)}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv{background:color-mix(in srgb,var(--bg) 70%, var(--card));border:1px solid var(--b);border-radius:12px;padding:8px}
.kv b{display:block;font-size:11px;opacity:.7;text-transform:uppercase}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 16px;max-width:1220px;margin:auto}
.btn{border:1px solid var(--b);background:var(--card);padding:8px 12px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.section{max-width:1220px;margin:18px auto;padding:0 16px}
.timeline{display:flex;gap:10px;overflow:auto;padding:10px 0}
.phase{min-width:140px;padding:12px;border-radius:14px;border:1px solid var(--b);background:var(--card);cursor:pointer}
.phase.active{background:var(--blue);color:white}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="nav">
  <div class="logo"><div class="badge">✈</div> VolAR</div>
  <div class="search"><span>🔍</span><input id="globalSearch" placeholder="Buscá avión, vuelo o aeropuerto…" oninput="doSearch(this.value)"></div>
  <button class="btn" onclick="toggleTheme()">🌓</button>
</div>
<div class="hero">
  <h1>VolAR<br>Conocé lo que vuela sobre Argentina.</h1>
  <p>15 aeropuertos principales, con pasajeros y fotos.</p>
  <div class="quick">
    <button class="chip" onclick="scrollToId('rutas')">🗺️ Ver los 15 aeropuertos</button>
    <button class="chip" onclick="scrollToId('aviones')">✈️ Aviones</button>
  </div>
</div>

<div class="tabs" id="filters"></div>
<div class="section"><div id="aircraftGrid" class="grid"></div></div>

<div class="section" id="rutas"><h2>🗺️ Los 15 aeropuertos más transitados de Argentina</h2>
<div class="card">
<div id="routeMap" style="display:flex;flex-wrap:wrap;gap:8px">Cargando aeropuertos desde airports.json…</div>
<div id="airportDetail" style="margin-top:16px"></div>
</div></div>

<div class="section" id="aviones"><h2>Aviones</h2><div id="soundList" class="grid"></div></div>

<script>
let DATA={
 aircraft:[
  {id:"a320", manufacturer:"Airbus", model:"A320", variant:"A320-200", length:37.57, wingspan:35.8, pax:186, range:6100, engines:"CFM56-5B", facts:"El más usado en Argentina."},
  {id:"b738", manufacturer:"Boeing", model:"737-800", variant:"737-8AS", length:39.5, wingspan:35.8, pax:189, range:5400, engines:"CFM56-7B", facts:"Sky Interior."},
  {id:"e190", manufacturer:"Embraer", model:"E190", variant:"E190AR", length:36.24, wingspan:28.72, pax:114, range:4500, engines:"CF34-10E", facts:"Regional."}
 ],
 airports: []
};

function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark')}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}
let activeMan='Todos';
function renderFilters(){const mans=['Todos',...new Set(DATA.aircraft.map(a=>a.manufacturer))];document.getElementById('filters').innerHTML=mans.map(m=>`<button class="btn ${activeMan===m?'primary':''}" onclick="setMan('${m}')">${m}</button>`).join('');}
function setMan(m){activeMan=m;renderFilters();renderAircraft()}
function renderAircraft(){
 const g=document.getElementById('aircraftGrid');
 const f=DATA.aircraft.filter(a=> activeMan==='Todos' || a.manufacturer===activeMan);
 g.innerHTML=f.map(a=>`<div class="card"><b>${a.manufacturer} ${a.model}</b><div class="spec"><div class="kv"><b>Capacidad</b>${a.pax}</div><div class="kv"><b>Alcance</b>${a.range}km</div></div><div style="margin-top:8px;color:var(--muted);font-size:12px">${a.facts}</div></div>`).join('');
}
function renderRoutes(){
 const map=document.getElementById('routeMap');
 if(!DATA.airports.length){map.innerHTML='No hay aeropuertos cargados. Revisá /data/airports.json';return}
 map.innerHTML=DATA.airports.map(ap=>`<button class="btn" onclick="showAirport('${ap.id}')">${ap.iata} — ${ap.city} <span style="opacity:.6">(${ap.pax.toLocaleString('es-AR')})</span></button>`).join('');
 // mostrar el primero por defecto
 showAirport(DATA.airports[0].id);
}
function showAirport(id){
 const ap=DATA.airports.find(a=>a.id===id);
 if(!ap) return;
 document.getElementById('airportDetail').innerHTML=`
  <div class="card" style="max-width:600px">
    <img src="${ap.image}" alt="${ap.name}" style="width:100%;height:220px;object-fit:cover;border-radius:14px;margin-bottom:12px" onerror="this.src='${ap.wiki_image||''}'; this.onerror=null; this.style.display=this.src?'block':'none'">
    <div style="font-size:20px;font-weight:800">${ap.name} (${ap.iata}/${ap.icao})</div>
    <div style="margin-top:8px;line-height:1.6">
      <b>Ciudad:</b> ${ap.city} - ${ap.prov}<br>
      <b>Pasajeros 2023:</b> ${ap.pax.toLocaleString('es-AR')}<br>
      <b>Aerolíneas:</b> ${ap.airlines.join(', ')}<br>
      <b>Imagen:</b> <code style="font-size:11px">${ap.image}</code>
    </div>
  </div>`;
}
function doSearch(q){
 q=q.toLowerCase();
 if(!q){renderRoutes();return}
 const filtered=DATA.airports.filter(a=> (a.city+a.name+a.iata).toLowerCase().includes(q));
 document.getElementById('routeMap').innerHTML=filtered.map(ap=>`<button class="btn" onclick="showAirport('${ap.id}')">${ap.iata} — ${ap.city}</button>`).join('');
 if(q.length>2) scrollToId('rutas');
}

// Cargar airports.json desde /public/data/
fetch('/data/airports.json')
 .then(r=>{
    if(!r.ok) throw new Error('no json');
    return r.json();
  })
 .then(json=>{
    DATA.airports=json;
    renderRoutes();
  })
 .catch(()=>{
    // fallback por si no encuentra el json (usa los 15 embebidos como respaldo)
    console.log('No se pudo cargar /data/airports.json, uso fallback');
    DATA.airports=[
      {id:"AEP",iata:"AEP",icao:"SABE",city:"Buenos Aires",name:"Aeroparque Jorge Newbery",prov:"CABA",pax:17738000,airlines:["AR","JA","FO"],image:"/images/airports/aep.jpg"},
      {id:"EZE",iata:"EZE",icao:"SAEZ",city:"Ezeiza",name:"Ministro Pistarini",prov:"Buenos Aires",pax:11911000,airlines:["AR"],image:"/images/airports/eze.jpg"},
      {id:"IGR",iata:"IGR",icao:"SARI",city:"Puerto Iguazu",name:"Cataratas del Iguazu",prov:"Misiones",pax:1785000,airlines:["AR","JA","FO"],image:"/images/airports/igr.jpg"}
    ];
    renderRoutes();
  });

renderFilters();renderAircraft();
</script>
</body>
</html>
