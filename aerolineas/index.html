<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aerolíneas y Rutas - VolAR</title>
<style>
body{margin:0;font:14px Inter,system-ui;background:#f7f8fb;color:#101828}
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e4e7ec;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:14px;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#0f62fe}
.grid2{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:7px 12px;text-decoration:none;color:#101828;display:inline-block}
.badge{font-size:10px;padding:3px 8px;border-radius:999px;background:#eef2ff;border:1px solid #e4e7ec}
.route{border-left:3px solid #0f62fe;padding:8px 12px;margin-bottom:8px;background:#fbfdff;border-radius:0 12px 12px 0}
</style>
</head><body>
<div class="nav">
  <a href="/">← Home</a><b>Aerolíneas y Rutas</b>
  <input id="q" placeholder="Buscar AR, Jetsmart..." class="btn" style="margin-left:auto" oninput="filtrar()">
</div>

<div class="grid2">
  <div><div id="airlinesGrid"></div></div>
  <div><div id="detail" style="position:sticky;top:70px"></div></div>
</div>

<script>
let AIRLINES=[], ROUTES=[], AIRCRAFT=[], AIRPORTS=[];
Promise.all([
  fetch('/data/airlines.json').then(r=>r.json()).catch(()=>[]),
  fetch('/data/routes.json').then(r=>r.json()).catch(()=>[]),
  fetch('/data/aircraft.json').then(r=>r.json()).catch(()=>[]),
  fetch('/data/airports.json').then(r=>r.json()).catch(()=>[])
]).then(([al,ro,ac,ap])=>{AIRLINES=al;ROUTES=ro;AIRCRAFT=ac;AIRPORTS=ap;filtrar()});

function filtrar(){
  let list=[...AIRLINES];
  const q=document.getElementById('q').value.toLowerCase();
  if(q) list=list.filter(a=>(a.nombre+a.iata+a.id).toLowerCase().includes(q));
  document.getElementById('airlinesGrid').innerHTML=list.map(a=>`
    <div class="card" onclick="showAirline('${a.id}')" style="display:flex;gap:12px;align-items:center;margin-bottom:10px">
      <img src="${a.logo}" style="width:48px;height:48px;object-fit:contain;border-radius:10px;background:#f7f8fb" onerror="this.style.display='none'">
      <div style="flex:1"><div style="font-weight:800">${a.nombre}</div><div style="font-size:11px;color:#667085">${a.iata}/${a.icao}</div></div>
    </div>
  `).join('');
  if(list[0]) showAirline(list[0].id);
}

function uniq(arr){return [...new Set(arr.filter(Boolean))]}
function getAirportName(code){
  const ap=AIRPORTS.find(x=>x.iata===code||x.id===code);
  if(!ap) return code;
  return `${ap.nombre_completo||ap.nombre} (${ap.iata})`;
}

function showAirline(id){
  const a=AIRLINES.find(x=>x.id===id); if(!a) return;
  // CORRECCIÓN: deduplica hubs y evita "Newbery" repetido
  const rawHubs=[...(a.hubs||[]),...(a.aeropuertos_principales||[])];
  const hubs=uniq(rawHubs).map(c=>c.trim()).filter(c=>c);
  // Si tenés AEP y "Aeroparque Jorge Newbery", lo unificamos a AEP
  const hubsClean=uniq(hubs.map(h=>{
    const up=h.toUpperCase();
    if(up.includes('NEWBERY')||up.includes('AEROPARQUE')) return 'AEP';
    if(up.includes('EZEIZA')||up.includes('PISTARINI')) return 'EZE';
    return h;
  }));

  const myRoutes=ROUTES.filter(r=> (r.aerolineaId===a.id || r.airlineId===a.id));
  const models=(a.modelos||a.flota||[]).map(mid=>AIRCRAFT.find(ac=>ac.id===mid)).filter(Boolean);

  document.getElementById('detail').innerHTML=`
    <div class="card" style="cursor:default">
      <div style="display:flex;gap:14px;align-items:center">
        <img src="${a.logo}" style="width:72px;height:72px;object-fit:contain;border-radius:14px;background:#f7f8fb" onerror="this.style.display='none'">
        <div><h2 style="margin:0">${a.nombre}</h2><div style="color:#667085">${a.pais||'Argentina'} • ${a.iata}/${a.icao}</div></div>
      </div>
      
      <div style="margin-top:16px"><b>Flota:</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${models.length? models.map(m=>`<a href="/aviones/#${m.id}" class="btn">${m.nombre_completo}</a>`).join('') : '<span style="font-size:12px;color:#667085">Sin flota cargada</span>'}</div></div>

      <div style="margin-top:18px"><b>Hubs principales:</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${hubsClean.map(h=>`<span class="btn" style="font-size:12px">${getAirportName(h)}</span>`).join('')}</div></div>

      <div style="margin-top:20px">
        <b>🗺️ Rutas (${myRoutes.length})</b>
        <div style="margin-top:10px;max-height:420px;overflow:auto">
          ${myRoutes.length? myRoutes.map(r=>`<div class="route"><b>${r.origen} → ${r.destino}</b><div style="font-size:12px;color:#667085">${r.tipo||'nacional'} • Aeronaves: ${(r.aircraftIds||[]).join(', ')||'varios modelos posibles'}</div></div>`).join('') : '<div style="font-size:12px;color:#667085;padding:10px">Aún no hay rutas en routes.json para esta aerolínea.</div>'}
        </div>
      </div>
    </div>
  `;
}
</script></body></html>
