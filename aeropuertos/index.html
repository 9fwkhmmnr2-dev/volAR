<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aeropuertos - VolAR</title>
<style>body{margin:0;font:14px Inter,system-ui;background:#f7f8fb}.nav{padding:12px 16px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:16px}.btn{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:6px 12px}</style>
</head><body>
<div class="nav"><a href="/">← Home</a><b>Aeropuertos - 8 más concurridos 2025</b><input id="q" placeholder="Buscar IATA, ciudad..." class="btn" oninput="filtrar()" style="margin-left:auto"><select id="fProv" class="btn" onchange="filtrar()"><option value="">Todas provincias</option><option>CABA</option><option>Buenos Aires</option><option>Córdoba</option><option>Mendoza</option><option>Río Negro</option><option>Misiones</option><option>Salta</option><option>Neuquén</option></select><select id="fTipo" class="btn" onchange="filtrar()"><option value="">Nacional/Internacional</option><option value="Internacional">Internacional</option><option value="Nacional">Nacional</option></select></div>
<div id="grid" class="grid">Cargando airports.json...</div><div id="detail" style="max-width:800px;margin:auto;padding:16px"></div>
<script>
let DATA=[];
fetch('/data/airports.json').then(r=>r.json()).then(j=>{DATA=j.slice(0,8);filtrar()});
function filtrar(){let list=[...DATA];const q=document.getElementById('q').value.toLowerCase();const prov=document.getElementById('fProv').value;const tipo=document.getElementById('fTipo').value;if(q) list=list.filter(a=>(a.ciudad+a.nombre_completo+a.iata).toLowerCase().includes(q));if(prov) list=list.filter(a=>a.provincia.includes(prov));if(tipo) list=list.filter(a=>a.tipo===tipo);render(list)}
function render(list){document.getElementById('grid').innerHTML=list.map(a=>`<div class="card" onclick="show('${a.id}')"><img src="${a.images?.principal?.url||a.image}" style="width:100%;height:140px;object-fit:cover;border-radius:12px" onerror="this.src='${a.images?.principal?.wiki_url||''}'"><div style="font-weight:800;margin-top:6px">#${a.ranking_2025} ${a.nombre_completo}</div><div style="font-size:12px;color:#667085">${a.iata}/${a.icao} • ${a.ciudad} - ${a.provincia} • ${a.tipo}</div><div style="font-size:12px;margin-top:4px">Pasajeros 2025: ${a.pasajeros_2025?.toLocaleString('es-AR')}<br><span style="font-size:10px;color:#667085">Promedio diario: ${a.promedio_diario_2025} (cálculo matemático anual, no real diario)</span></div></div>`).join(''); if(list[0]) show(list[0].id)}
function show(id){const a=DATA.find(x=>x.id===id);if(!a) return;document.getElementById('detail').innerHTML=`<div class="card"><img src="${a.images?.principal?.url||a.image}" style="width:100%;height:260px;object-fit:cover;border-radius:14px" onerror="this.src='${a.images?.principal?.wiki_url||''}'"><h2>${a.nombre_completo} (${a.iata})</h2><p>${a.ciudad} - ${a.provincia}, ${a.pais}<br>Altitud: ${a.altitud_m}m • Pistas: ${a.pistas?.map(p=>p.designacion+' '+p.longitud_m+'m').join(', ')}<br>Aerolíneas: ${a.aerolineas?.join(', ')}<br>Destinos: ${a.destinos_principales?.join(', ')||''}<br>Pasajeros 2025: ${a.pasajeros_2025?.toLocaleString('es-AR')}</p><p style="font-size:12px;color:#667085">Imagen: ${a.images?.principal?.fuente||''}</p></div>`}
</script></body></html>
