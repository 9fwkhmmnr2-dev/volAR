<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aviones - VolAR</title>
<style>
body{margin:0;font:14px Inter,system-ui;background:#f7f8fb;color:#101828}
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e4e7ec;padding:12px 16px;display:flex;gap:10px;align-items:center}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:20px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#0f62fe}
.grid{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.thumb{height:170px;background:#eef2ff;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:#fff;border:1px solid #e4e7ec;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}
.chip{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:4px 8px;font-size:11px;display:inline-block;margin:2px}
.btn{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:7px 12px}
</style>
</head><body>
<div class="nav">
  <a href="/">← Home</a><b>Aviones</b>
  <input id="q" placeholder="Buscar A320, Boeing..." class="btn" style="margin-left:auto" oninput="filtrar()">
  <select id="fFab" class="btn" onchange="filtrar()"><option value="">Todos fabricantes</option><option>Airbus</option><option>Boeing</option><option>Embraer</option></select>
</div>
<div id="grid" class="grid"></div>

<script>
let DATA=[];
fetch('/data/aircraft.json').then(r=>r.json()).then(j=>{DATA=j;filtrar()});

function filtrar(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const fab=document.getElementById('fFab').value;
  let list=[...DATA];
  if(q) list=list.filter(a=>(a.nombre_completo+' '+(a.operado_por||[]).join(' ')).toLowerCase().includes(q));
  if(fab) list=list.filter(a=>a.fabricante===fab);
  document.getElementById('grid').innerHTML=list.map(a=>`
    <div class="card">
      <div class="thumb">
        <span class="badge">${a.fabricante||''} • ${a.familia||''}</span>
        <img src="${a.imagen||'/images/aircraft/placeholder.jpg'}" onerror="this.src='https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=800'">
      </div>
      <div style="padding:12px">
        <div style="font-weight:800;font-size:15px">${a.nombre_completo||a.id}</div>
        <div style="font-size:12px;color:#667085;margin-top:2px">${a.asientos? a.asientos+' asientos • ' : ''}${a.caracteristica||''}</div>
        <div style="margin-top:10px"><b style="font-size:11px">Operado por:</b><div style="margin-top:4px">${(a.operado_por||[]).map(op=>`<span class="chip">${op}</span>`).join('')||'<span style="font-size:11px;color:#667085">-</span>'}</div></div>
      </div>
    </div>
  `).join('')||'<div style="padding:20px;color:#667085">No hay aviones que coincidan</div>';
}
</script></body></html>
