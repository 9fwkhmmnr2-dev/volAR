<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aviones - VolAR</title>
<style>body{margin:0;font:14px Inter,system-ui;background:#f7f8fb;color:#101828}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #e4e7ec;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:12px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#0f62fe}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:16px}.btn{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:6px 12px}</style>
</head><body>
<div class="nav"><a href="/">← Home</a><b>Aviones</b><input id="q" placeholder="Buscar A320, 737..." style="margin-left:auto;border:1px solid #e4e7ec;border-radius:999px;padding:7px 12px" oninput="filtrar()"><select id="fFab" class="btn" onchange="filtrar()"><option value="">Todos fabricantes</option><option>Airbus</option><option>Boeing</option><option>Embraer</option><option>ATR</option></select><select id="fTipo" class="btn" onchange="filtrar()"><option value="">Todos tipos</option><option value="regional">Regional</option><option value="narrow-body">Narrow-body</option><option value="wide-body">Wide-body</option></select><select id="fMot" class="btn" onchange="filtrar()"><option value="">Motores</option><option value="2">2 motores</option><option value="4">4 motores</option></select></div>
<div id="grid" class="grid">Cargando aircraft.json...</div>
<div id="detail" style="max-width:800px;margin:0 auto;padding:16px"></div>
<script>
let DATA=[];
fetch('/data/aircraft.json').then(r=>r.json()).then(j=>{DATA=j;const q=new URLSearchParams(location.search).get('q');if(q) document.getElementById('q').value=q;filtrar()}).catch(()=>{document.getElementById('grid').innerHTML='Falta /data/aircraft.json - usá el ejemplo que te pasé'});
function filtrar(){let list=[...DATA];const q=document.getElementById('q').value.toLowerCase();const fab=document.getElementById('fFab').value;const tipo=document.getElementById('fTipo').value;const mot=document.getElementById('fMot').value;if(q) list=list.filter(a=>(a.nombre_completo+a.modelo+a.fabricante).toLowerCase().includes(q));if(fab) list=list.filter(a=>a.fabricante===fab);if(tipo) list=list.filter(a=>a.tipo===tipo);if(mot) list=list.filter(a=>String(a.motores_cantidad)===mot);render(list)}
function render(list){document.getElementById('grid').innerHTML=list.map(a=>`<div class="card" onclick="show('${a.id}')"><img src="${a.image}" style="width:100%;height:150px;object-fit:cover;border-radius:12px" onerror="this.style.display='none'"><div style="font-weight:800;margin-top:8px">${a.nombre_completo}</div><div style="font-size:12px;color:#667085">${a.fabricante} • ${a.tipo} • ${a.pax} pax • ${a.alcance_km}km</div><div style="font-size:11px;margin-top:4px;color:#667085">${a.aerolineas?.join(', ')||''}</div></div>`).join('')||'<div style="padding:20px">Sin resultados</div>'; if(list[0] &&!location.hash) show(list[0].id)}
function show(id){const a=DATA.find(x=>x.id===id);if(!a) return;location.hash=id;document.getElementById('detail').innerHTML=`<div class="card"><img src="${a.image}" style="width:100%;height:260px;object-fit:cover;border-radius:14px" onerror="this.style.display='none'"><h2>${a.nombre_completo}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><b>Fabricante:</b> ${a.fabricante}</div><div><b>Variante:</b> ${a.variante}</div><div><b>Longitud:</b> ${a.longitud_m}m</div><div><b>Envergadura:</b> ${a.envergadura_m}m</div><div><b>MTOW:</b> ${a.mtow_kg}kg</div><div><b>Pax:</b> ${a.pax}</div><div><b>Alcance:</b> ${a.alcance_km}km</div><div><b>Motores:</b> ${a.motores} (${a.motores_cantidad})</div></div><p style="margin-top:12px"><b>Aerolíneas:</b> ${a.aerolineas?.map(id=>`<a href="/aerolineas/?q=${id}">${id}</a>`).join(', ')}</p><p><b>Curiosidad:</b> ${a.curiosidad||''}</p><p style="font-size:11px;color:#667085">Imagen: ${a.imageSource} • ${a.imageAuthor} • ${a.imageLicense}</p></div>`;window.scrollTo({top:document.getElementById('detail').offsetTop-80,behavior:'smooth'})}
</script></body></html>
