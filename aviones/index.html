<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aviones - VolAR</title>
<style>
body{margin:0;font:14px Inter,system-ui;background:#f2f4f7;color:#101828}
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e4e7ec;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:320px 1fr;gap:16px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:12px;cursor:pointer;transition:.2s}
.card:hover{border-color:#0f62fe}
.card.active{border-color:#0f62fe;box-shadow:0 4px 16px rgba(15,98,254,.15)}
.detail{position:sticky;top:70px;background:#fff;border:1px solid #e4e7ec;border-radius:20px;overflow:hidden}
.detail img{width:100%;height:220px;object-fit:cover;background:#eef2ff}
.detail-body{padding:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv div{background:#f7f8fb;border-radius:10px;padding:8px 10px}
.chip{display:inline-block;border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:4px 9px;font-size:11px;margin:2px}
.btn{border:1px solid #e4e7ec;background:#fff;border-radius:999px;padding:7px 12px}
</style>
</head><body>
<div class="nav"><a href="/">← Home</a><b>Aviones</b><input id="q" placeholder="Buscar A320, 737..." class="btn" style="margin-left:auto" oninput="filtrar()"></div>
<div class="grid"><div id="list" class="list"></div><div id="detail"></div></div>
<script>
let DATA=[];
fetch('/data/aircraft.json').then(r=>r.json()).then(j=>{DATA=j;filtrar()});
function safe(v, suf=''){ if(v===undefined||v===null||v==='') return ''; return v + suf; }
function filtrar(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  let list=DATA.filter(a=>!q || (a.nombre_completo+' '+(a.operado_por||[]).join(' ')).toLowerCase().includes(q));
  document.getElementById('list').innerHTML=list.map(a=>`
    <div class="card" onclick="show('${a.id}')" id="c-${a.id}">
      <div style="font-weight:800">${safe(a.nombre_completo)}</div>
      <div style="font-size:12px;color:#667085">${safe(a.fabricante)}${a.familia?' · '+a.familia:''}${a.pax?' · '+a.pax+' pax':''}${a.alcance_km?' · '+a.alcance_km+'km':''}</div>
    </div>
  `).join('');
  if(list[0]) show(list[0].id);
}
function show(id){
  const a=DATA.find(x=>x.id===id); if(!a) return;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  const el=document.getElementById('c-'+id); if(el) el.classList.add('active');
  document.getElementById('detail').innerHTML=`
    <div class="detail">
      <img src="${a.imagen}" onerror="this.src='https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=800'">
      <div class="detail-body">
        <h2 style="margin:0">${safe(a.nombre_completo)}</h2>
        <div style="margin-top:12px" class="kv">
          <div><b>Fabricante:</b> ${safe(a.fabricante)}</div>
          <div><b>Variante:</b> ${safe(a.variante)}</div>
          <div><b>Longitud:</b> ${safe(a.longitud_m,'m')}</div>
          <div><b>Envergadura:</b> ${safe(a.envergadura_m,'m')}</div>
          <div><b>MTOW:</b> ${safe(a.mtow_kg,'kg')}</div>
          <div><b>Pax:</b> ${safe(a.pax)}</div>
          <div><b>Alcance:</b> ${safe(a.alcance_km,'km')}</div>
          <div><b>Motores:</b> ${safe(a.motores)}<br><span style="font-size:11px;color:#667085">${safe(a.motores_tipo)}</span></div>
        </div>
        <div style="margin-top:14px"><b>Aerolíneas:</b><br><div style="margin-top:6px">${(a.operado_por||[]).map(o=>`<span class="chip">${o}</span>`).join('')}</div></div>
        <div style="margin-top:14px"><b>Curiosidad:</b><div style="color:#475467;margin-top:4px">${safe(a.curiosidad)}</div></div>
        <div style="margin-top:12px;font-size:11px;color:#98a2b3">Imagen: ${safe(a.imagen_autor)} · ${safe(a.imagen_licencia)}</div>
      </div>
    </div>
  `;
}
</script></body></html>
